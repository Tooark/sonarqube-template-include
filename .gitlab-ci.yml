spec:
  inputs:
    language:
      description: "Program Language for Scan and Quality Gate"
      type: string
      default: "node"
      options:
      - maven # Maven
      - gradle # Gradle
      - dotnet # C#/.NET
      - python # Python
      - node # Node.js
      - go # Go
      - other # Other
    arch:
      description: "Architecture for Scan and Quality Gate"
      type: string
      default: "arm64"
      options:
      - arm64 # ARM64
      - amd64 # AMD64
    excludes:
      description: "Files and folders to exclude from analysis"
      type: string
      default: ""
    stage:
      description: "Stage to run SonarQube"
      type: string
      default: sast
    environment:
      description: "Environment for Scan and Quality Gate"
      type: string
      default: sonarqube
    image:
      description: "Docker image to use for the job"
      type: string
      default: "public.ecr.aws/n6a9k4a7/deploy:1-sonarqube"
    # Sonarqube Quality Gate variables
    quality_gate:
      description: "Wait for Quality Gate"
      type: boolean
      default: true
    quality_gate_timeout:
      description: "Timeout for Quality Gate"
      type: string
      default: "300"
    #.NET variables
    dotnet_version:
      description: ".NET version"
      type: string
      default: "10.0"
    dotnet_path_sln_or_csproj:
      description: "Path for .sln or .csproj"
      type: string
      default: ""
    dotnet_test_and_coverage:
      description: "Run tests and collect coverage for .NET projects"
      type: boolean
      default: false
    # Gradle variables
    gradle_version:
      description: "Gradle version"
      type: string
      default: "9-jdk17-jammy"
    # Maven variables
    maven_version:
      description: "Maven version"
      type: string
      default: "3.9"
    go_version:
      description: "Go version"
      type: string
      default: "1.26"
    # DefectDojo variables
    send_to_defectdojo:
      description: "Enable DefectDojo upload (true/false)"
      type: string
      default: "false"
    defectdojo_url:
      description: "DefectDojo instance URL"
      type: string
      default: ""
    defectdojo_api_key:
      description: "DefectDojo API key"
      type: string
      default: ""
    defectdojo_product_name:
      description: "DefectDojo product name (auto_create_context)"
      type: string
      default: ""
    defectdojo_engagement_name:
      description: "DefectDojo engagement name (auto_create_context)"
      type: string
      default: ""
    defectdojo_engagement_id:
      description: "DefectDojo engagement ID (fallback)"
      type: string
      default: ""
    defectdojo_product_type_name:
      description: "DefectDojo product type name (used to create product on first run)"
      type: string
      default: "Research and Development"
---
default:
  retry:
    max: 2
    when:
    - runner_system_failure
    - stuck_or_timeout_failure
    - unknown_failure
    - api_failure
    - job_execution_timeout

variables:
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"

stages:
- $[[ inputs.stage ]]

# ARM64
sonarqube:
  rules:
  - if: '"$[[ inputs.language | expand_vars ]]" == "" || "$[[ inputs.language | expand_vars ]]" == "node" || "$[[ inputs.language | expand_vars ]]" == "other" && "$[[ inputs.arch | expand_vars ]]" == "arm64"'
  environment: $[[ inputs.environment ]]
  stage: $[[ inputs.stage ]]
  image: $[[ inputs.image | expand_vars ]]
  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
    - "${SONAR_USER_HOME}/cache"
    - sonar-scanner/
  before_script:
  # Verifica se as variáveis obrigatórias estão definidas
  - '[ -n "${SONAR_HOST_URL:-}" ] || { echo "ERROR: SONAR_HOST_URL is not defined"; exit 1; }'
  - '[ -n "${SONAR_TOKEN:-}" ]    || { echo "ERROR: SONAR_TOKEN is not defined"; exit 1; }'
  script:
  - sonar-scanner -Dsonar.host.url="$SONAR_HOST_URL" -Dsonar.token="$SONAR_TOKEN" -Dsonar.projectKey="$SONAR_PROJECT_KEY" -Dsonar.sourceEncoding=UTF-8 -Dsonar.exclusions="$[[ inputs.excludes | expand_vars ]]"
  - |
    exit_status=$?
    if [ $exit_status -eq 0 ]; then
      echo "SonarQube successfully!"
      echo "Url to project: $SONAR_HOST_URL/dashboard?id=$SONAR_PROJECT_KEY"
    else
      echo "SonarQube failed!"
      echo "Url to project: $SONAR_HOST_URL/dashboard?id=$SONAR_PROJECT_KEY"
      exit 1
    fi

# AMD64
sonarqube_amd64:
  rules:
  - if: '"$[[ inputs.language | expand_vars ]]" == "" || "$[[ inputs.language | expand_vars ]]" == "node" || "$[[ inputs.language | expand_vars ]]" == "other" && "$[[ inputs.arch | expand_vars ]]" == "amd64"'
  environment: $[[ inputs.environment ]]
  stage: $[[ inputs.stage ]]
  image:
    name: sonarsource/sonar-scanner-cli:11
    entrypoint: [ "" ]
  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
    - "${SONAR_USER_HOME}/cache"
    - sonar-scanner/
  before_script:
  # Verifica se as variáveis obrigatórias estão definidas
  - '[ -n "${SONAR_HOST_URL:-}" ] || { echo "ERROR: SONAR_HOST_URL is not defined"; exit 1; }'
  - '[ -n "${SONAR_TOKEN:-}" ]    || { echo "ERROR: SONAR_TOKEN is not defined"; exit 1; }'
  script:
  - sonar-scanner -Dsonar.host.url="$SONAR_HOST_URL" -Dsonar.token="$SONAR_TOKEN" -Dsonar.projectKey="$SONAR_PROJECT_KEY" -Dsonar.sourceEncoding=UTF-8 -Dsonar.exclusions="$[[ inputs.excludes | expand_vars ]]"
  - |
    exit_status=$?
    if [ $exit_status -eq 0 ]; then
      echo "SonarQube scan completed successfully."
      echo "Url to project: $SONAR_HOST_URL/dashboard?id=$SONAR_PROJECT_KEY"
    else
      echo "SonarQube scan failed."
      echo "Url to project: $SONAR_HOST_URL/dashboard?id=$SONAR_PROJECT_KEY"
      exit 1
    fi
  tags:
  - amd64-dedicated

# Python
sonar_python:
  rules:
  - if: '"$[[ inputs.language | expand_vars ]]" == "python"'
  environment: $[[ inputs.environment ]]
  stage: $[[ inputs.stage ]]
  image:
    name: $[[ inputs.image | expand_vars ]]
    entrypoint: [ "" ]
  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
    - "${SONAR_USER_HOME}/cache"
    - sonar-scanner/
  script:
  - >
    sonar-scanner -Dsonar.host.url="$SONAR_HOST_URL" -Dsonar.token="$SONAR_TOKEN" -Dsonar.projectKey="$SONAR_PROJECT_KEY" -Dsonar.sourceEncoding=UTF-8 -Dsonar.qualitygate.wait=$[[ inputs.quality_gate ]] -Dsonar.qualitygate.timeout=$[[ inputs.quality_gate_timeout ]]

#.NET
sonar_dotnet_test_coverage:
  rules:
  - if: '"$[[ inputs.language | expand_vars ]]" == "dotnet" && "$[[ inputs.dotnet_test_and_coverage ]]" == "true"'
  image: mcr.microsoft.com/dotnet/sdk:$[[inputs.dotnet_version | expand_vars]]-alpine
  stage: $[[ inputs.stage ]]
  environment: $[[ inputs.environment ]]
  before_script:
  - apk add --no-cache bash curl jq
  - dotnet tool install --global dotnet-sonarscanner
  - export PATH="$HOME/.dotnet/tools:$PATH"
  # Verifica se as variáveis obrigatórias estão definidas
  - '[ -n "${SONAR_HOST_URL:-}" ] || { echo "ERROR: SONAR_HOST_URL is not defined"; exit 1; }'
  - '[ -n "${SONAR_TOKEN:-}" ]    || { echo "ERROR: SONAR_TOKEN is not defined"; exit 1; }'

  script:
  # 1) Inicia a análise (apontando para OpenCover)
  - >
    dotnet-sonarscanner begin /k:"$SONAR_PROJECT_KEY" /d:sonar.host.url="$SONAR_HOST_URL" /d:sonar.token="$SONAR_TOKEN" /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml" /d:sonar.cs.vstest.reportsPaths="TestResults/*.trx"

  # 2) Build da solução/projeto (utilizando --no-incremental para garantir que tudo seja recompilado)
  - >
    dotnet build $[[inputs.dotnet_path_sln_or_csproj]] --no-incremental

  # 3) Testes + cobertura (GERA DOIS FORMATOS: cobertura + opencover)
  - >
    dotnet test --configuration Debug --results-directory TestResults --collect:"XPlat Code Coverage;Format=cobertura,opencover"

  # 4) Consolida 1 arquivo Cobertura com nome estável para o GitLab
  - >
    COB_FILE=$(find TestResults -name 'coverage.cobertura.xml' | head -n 1) && cp "$COB_FILE" coverage.cobertura.xml

  # 5) Finaliza a análise e aguarda o Quality Gate (timeout de 5 minutos)
  - >
    dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN" /d:sonar.qualitygate.wait=$[[ inputs.quality_gate ]] /d:sonar.qualitygate.timeout=$[[ inputs.quality_gate_timeout ]]

  artifacts:
    when: always
    paths:
    - TestResults/**
    - coverage.cobertura.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.cobertura.xml

# ARM64
sonarqube_dotnet:
  rules:
  - if: '"$[[ inputs.language | expand_vars ]]" == "dotnet"'
  stage: $[[ inputs.stage ]]
  environment: $[[ inputs.environment ]]
  image: mcr.microsoft.com/dotnet/sdk:$[[inputs.dotnet_version]]-noble-arm64v8
  before_script:
  - apt-get update && apt-get install -y curl gnupg
  - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
  - apt-get install -y nodejs
  - node -v && npm -v
  - dotnet tool install --global dotnet-sonarscanner
  - dotnet tool install --global dotnet-coverage
  - export PATH="$HOME/.dotnet/tools:$PATH"
  - |
    if [ -n "${NUGET_URL}" ] && [ -n "${NUGET_USER}" ] && [ -n "${NUGET_PASS}" ]; then
      echo "Adicionando source NuGet..."
      dotnet nuget add source "${NUGET_URL}" -n github -u "${NUGET_USER}" -p "${NUGET_PASS}" --store-password-in-clear-text
    else
      echo "Variáveis de NuGet não definidas. Pulando configuração."
    fi
  script:
  - >
    dotnet-sonarscanner begin \
      /k:"${SONAR_PROJECT_KEY}" \
      /d:sonar.host.url="${SONAR_HOST_URL}" \
      /d:sonar.token="${SONAR_TOKEN}" \
      /d:sonar.projectBaseDir="${CI_PROJECT_DIR}" \
      /d:sonar.cs.opencover.reportsPaths="coverage.xml"
  - dotnet build $[[inputs.dotnet_path_sln_or_csproj]] --no-incremental
  - >
    dotnet-coverage collect \
      "dotnet test $[[inputs.dotnet_path_sln_or_csproj]] --configuration Debug /p:CoverletOutputFormat=opencover /p:CoverletOutput='coverage.xml'" \
      -f xml -o "coverage.xml"
  - dotnet-sonarscanner end /d:sonar.token="${SONAR_TOKEN}"
  - |
    exit_status=$?
    if [ $exit_status -eq 0 ]; then
      echo "SonarQube scan completed successfully."
      echo "Url to project: $SONAR_HOST_URL/dashboard?id=$SONAR_PROJECT_KEY"
    else
      echo "SonarQube scan failed."
      echo "Url to project: $SONAR_HOST_URL/dashboard?id=$SONAR_PROJECT_KEY"
      exit 1
    fi

# AMD64
sonarqube_dotnet_amd64:
  rules:
  - if: '"$[[ inputs.language | expand_vars ]]" == "dotnet" && "$[[ inputs.arch | expand_vars ]]" == "amd64"'
  stage: $[[ inputs.stage ]]
  environment: $[[ inputs.environment ]]
  image: mcr.microsoft.com/dotnet/sdk:$[[inputs.dotnet_version]]-alpine
  before_script:
  - apk add --no-cache nodejs npm
  - node -v && npm -v
  - dotnet tool install --global dotnet-sonarscanner
  - dotnet tool install --global dotnet-coverage
  - export PATH="$HOME/.dotnet/tools:$PATH"
  - |
    if [ -n "${NUGET_URL}" ] && [ -n "${NUGET_USER}" ] && [ -n "${NUGET_PASS}" ]; then
      echo "Adicionando source NuGet..."
      dotnet nuget add source "${NUGET_URL}" -n github -u "${NUGET_USER}" -p "${NUGET_PASS}" --store-password-in-clear-text
    else
      echo "Variáveis de NuGet não definidas. Pulando configuração."
    fi
  script:
  - >
    dotnet-sonarscanner begin \
      /k:"${SONAR_PROJECT_KEY}" \
      /d:sonar.host.url="${SONAR_HOST_URL}" \
      /d:sonar.token="${SONAR_TOKEN}" \
      /d:sonar.projectBaseDir="${CI_PROJECT_DIR}" \
      /d:sonar.cs.opencover.reportsPaths="coverage.xml"
  - dotnet build $[[inputs.dotnet_path_sln_or_csproj]] --no-incremental
  - >
    dotnet-coverage collect \
      "dotnet test $[[inputs.dotnet_path_sln_or_csproj]] --configuration Debug /p:CoverletOutputFormat=opencover /p:CoverletOutput='coverage.xml'" \
      -f xml -o "coverage.xml"
  - dotnet-sonarscanner end /d:sonar.token="${SONAR_TOKEN}"
  - |
    exit_status=$?
    if [ $exit_status -eq 0 ]; then
      echo "SonarQube scan completed successfully."
      echo "Url to project: $SONAR_HOST_URL/dashboard?id=$SONAR_PROJECT_KEY"
    else
      echo "SonarQube scan failed."
      echo "Url to project: $SONAR_HOST_URL/dashboard?id=$SONAR_PROJECT_KEY"
      exit 1
    fi
  tags:
  - amd64-dedicated

# Maven
sonar_maven:
  rules:
  - if: '"$[[ inputs.language | expand_vars ]]" == "maven"'
  environment: $[[ inputs.environment ]]
  stage: $[[ inputs.stage ]]
  image: "maven:$[[inputs.maven_version | expand_vars]]"
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
    - "${SONAR_USER_HOME}/cache"
    - sonar-scanner/
  before_script:
  # Verifica se as variáveis obrigatórias estão definidas
  - '[ -n "${SONAR_HOST_URL:-}" ] || { echo "ERROR: SONAR_HOST_URL is not defined"; exit 1; }'
  - '[ -n "${SONAR_TOKEN:-}" ]    || { echo "ERROR: SONAR_TOKEN is not defined"; exit 1; }'
  script:
  - mvn verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.host.url="$SONAR_HOST_URL" -Dsonar.token="$SONAR_TOKEN" -Dsonar.projectKey="$SONAR_PROJECT_KEY" -Dsonar.sourceEncoding=UTF-8 -Dsonar.exclusions="$[[ inputs.excludes | expand_vars ]]"

# Gradle
sonar_gradle:
  rules:
  - if: '"$[[ inputs.language | expand_vars ]]" == "gradle"'
  environment: $[[ inputs.environment ]]
  stage: $[[ inputs.stage ]]
  image: "gradle:$[[inputs.gradle_version | expand_vars]]"
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
    - "${SONAR_USER_HOME}/cache"
    - sonar-scanner/
  before_script:
  # Verifica se as variáveis obrigatórias estão definidas
  - '[ -n "${SONAR_HOST_URL:-}" ] || { echo "ERROR: SONAR_HOST_URL is not defined"; exit 1; }'
  - '[ -n "${SONAR_TOKEN:-}" ]    || { echo "ERROR: SONAR_TOKEN is not defined"; exit 1; }'
  script: gradle sonarqube -Dsonar.host.url="$SONAR_HOST_URL" -Dsonar.token="$SONAR_TOKEN" -Dsonar.projectKey="$SONAR_PROJECT_KEY" -Dsonar.sourceEncoding=UTF-8 -Dsonar.exclusions="$[[ inputs.excludes | expand_vars ]]"

# Go
sonar_go:
  rules:
  - if: '"$[[ inputs.language | expand_vars ]]" == "go"'
  environment: $[[ inputs.environment ]]
  stage: $[[ inputs.stage ]]
  image: "golang:$[[inputs.go_version | expand_vars]]-alpine"
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
    - "${SONAR_USER_HOME}/cache"
    - sonar-scanner/
  before_script:
  # Verifica se as variáveis obrigatórias estão definidas
  - '[ -n "${SONAR_HOST_URL:-}" ] || { echo "ERROR: SONAR_HOST_URL is not defined"; exit 1; }'
  - '[ -n "${SONAR_TOKEN:-}" ]    || { echo "ERROR: SONAR_TOKEN is not defined"; exit 1; }'
  - apk add --no-cache bash curl unzip
  - curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-4.8.0.2856-linux.zip && unzip sonar-scanner.zip -d /opt && rm sonar-scanner.zip
  - export PATH="/opt/sonar-scanner-4.8.0.2856-linux/bin:$PATH" && sonar-scanner --version
  script:
  - sonar-scanner -Dsonar.host.url="$SONAR_HOST_URL" -Dsonar.token="$SONAR_TOKEN" -Dsonar.projectKey="$SONAR_PROJECT_KEY" -Dsonar.sourceEncoding=UTF-8 -Dsonar.exclusions="$[[ inputs.excludes | expand_vars ]]"

# DefectDojo upload
sonarqube_defectdojo:
  rules:
  - if: '$SEND_TO_DEFECTDOJO == "true"'
    when: on_success
  - if: '$[[ inputs.send_to_defectdojo ]] == "true"'
    when: on_success
  - when: never
  image: alpine
  stage: $[[ inputs.stage ]]
  environment: $[[ inputs.environment ]]
  needs:
  - job: sonarqube
    optional: true
  - job: sonarqube_amd64
    optional: true
  - job: sonar_python
    optional: true
  - job: sonar_dotnet_test_coverage
    optional: true
  - job: sonarqube_dotnet
    optional: true
  - job: sonarqube_dotnet_amd64
    optional: true
  - job: sonar_maven
    optional: true
  - job: sonar_gradle
    optional: true
  - job: sonar_go
    optional: true
  before_script:
  - apk add --no-cache curl jq
  variables:
    DD_URL: $[[ inputs.defectdojo_url ]]
    DD_TOKEN: $[[ inputs.defectdojo_api_key ]]
    DD_PRODUCT: $[[ inputs.defectdojo_product_name ]]
    DD_PRODUCT_TYPE: $[[ inputs.defectdojo_product_type_name ]]
    DD_ENGAGEMENT_NAME: $[[ inputs.defectdojo_engagement_name ]]
    DD_ENGAGEMENT_ID: $[[ inputs.defectdojo_engagement_id ]]
  script:
  - |
    set -eu

    SEND_FLAG="${SEND_TO_DEFECTDOJO:-$[[ inputs.send_to_defectdojo ]]}"
    if [ "$SEND_FLAG" != "true" ]; then
      echo "SEND_TO_DEFECTDOJO != true - skipping upload"
      exit 0
    fi
    if [ -z "${DD_URL:-}" ] || [ -z "${DD_TOKEN:-}" ]; then
      echo "ERROR: DD_URL/DD_TOKEN are required when SEND_TO_DEFECTDOJO=true"
      exit 1
    fi
    if [ -z "${SONAR_HOST_URL:-}" ] || [ -z "${SONAR_TOKEN:-}" ] || [ -z "${SONAR_PROJECT_KEY:-}" ]; then
      echo "ERROR: SONAR_HOST_URL/SONAR_TOKEN/SONAR_PROJECT_KEY are required"
      exit 1
    fi

    PAGE_SIZE=500
    mkdir -p .sonar_pages
    rm -f .sonar_pages/*.json

    # 1) Fetch unresolved issues (BUG, VULNERABILITY, CODE_SMELL) - paginated
    PAGE=1
    while : ; do
      curl -sS -u "$SONAR_TOKEN:" \
        "$SONAR_HOST_URL/api/issues/search?componentKeys=$SONAR_PROJECT_KEY&resolved=false&ps=$PAGE_SIZE&p=$PAGE" \
        -o ".sonar_pages/issues_$PAGE.json"
      TOTAL=$(jq -r '.paging.total // 0' ".sonar_pages/issues_$PAGE.json")
      FETCHED=$((PAGE * PAGE_SIZE))
      { [ "$FETCHED" -ge "$TOTAL" ] || [ "$FETCHED" -ge 10000 ]; } && break
      PAGE=$((PAGE + 1))
    done

    # 2) Fetch security hotspots - paginated (best effort)
    PAGE=1
    while : ; do
      curl -sS -u "$SONAR_TOKEN:" \
        "$SONAR_HOST_URL/api/hotspots/search?projectKey=$SONAR_PROJECT_KEY&ps=$PAGE_SIZE&p=$PAGE" \
        -o ".sonar_pages/hotspots_$PAGE.json"
      TOTAL=$(jq -r '.paging.total // 0' ".sonar_pages/hotspots_$PAGE.json")
      FETCHED=$((PAGE * PAGE_SIZE))
      { [ "$FETCHED" -ge "$TOTAL" ] || [ "$FETCHED" -ge 10000 ]; } && break
      PAGE=$((PAGE + 1))
    done

    # 3) Merge all pages into a single DefectDojo-compatible SonarQube JSON.
    #    The "SonarQube Scan" parser routes to its REST-API JSON reader when the
    #    payload exposes both "paging" and "components" keys.
    jq -s '{
      paging:     (.[0].paging // {pageIndex: 1, pageSize: 500, total: 0}),
      issues:     (map(.issues     // []) | add),
      hotspots:   (map(.hotspots   // []) | add),
      components: (map(.components // []) | add | unique_by(.key)),
      rules:      (map(.rules      // []) | add | unique_by(.key))
    }' .sonar_pages/*.json > sonarqube-issues.json

    echo "Issues:   $(jq '.issues   | length' sonarqube-issues.json)"
    echo "Hotspots: $(jq '.hotspots | length' sonarqube-issues.json)"

    # 4) Reimport into DefectDojo: creates product/engagement/test on the first
    #    run and updates them (closing stale findings) on every subsequent run.
    set -- -k -sS -X POST "$DD_URL/api/v2/reimport-scan/" \
      -H "Authorization: Token $DD_TOKEN" \
      -F "file=@sonarqube-issues.json;type=application/json" \
      -F "scan_type=SonarQube Scan" \
      -F "test_title=SonarQube - SAST" \
      -F "active=true" \
      -F "verified=false" \
      -F "close_old_findings=true" \
      -F "minimum_severity=Info"

    if [ -n "${DD_ENGAGEMENT_ID:-}" ]; then
      set -- "$@" -F "engagement=$DD_ENGAGEMENT_ID"
    else
      set -- "$@" \
        -F "auto_create_context=true" \
        -F "product_type_name=$DD_PRODUCT_TYPE" \
        -F "product_name=$DD_PRODUCT" \
        -F "engagement_name=$DD_ENGAGEMENT_NAME"
    fi

    HTTP_CODE=$(curl "$@" -o dd_response.json -w "%{http_code}")
    echo "DefectDojo HTTP $HTTP_CODE"
    cat dd_response.json 2>/dev/null || true
    echo
    case "$HTTP_CODE" in
      2*) echo "DefectDojo reimport completed successfully." ;;
      *)  echo "ERROR: DefectDojo reimport failed (HTTP $HTTP_CODE)"; exit 1 ;;
    esac
  artifacts:
    when: always
    paths:
    - sonarqube-issues.json
    - dd_response.json
    expire_in: 7 days
